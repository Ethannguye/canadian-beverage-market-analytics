name: CIMT HS6 five-category full-trade MySQL integration
on:
  push:
    branches: [main]
    paths:
      - 'data/source_exports/cimt/**'
      - 'etl/prepare_cimt_all.py'
      - 'etl/prepare_cimt_2201.py'
      - 'etl/prepare_cimt_trade.py'
      - 'etl/prepare_cimt_exports.py'
      - 'etl/load_cimt_csv.py'
      - 'sql/**'
      - '.github/workflows/cimt-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: temporary_ci_test_password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptemporary_ci_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      MYSQL_PWD: temporary_ci_test_password
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: temporary_ci_test_password
      MYSQL_DATABASE: canadian_beverage_market
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python and MySQL client
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y default-mysql-client
      - name: Normalize ten original CIMT files and calculate balances for five codes
        run: python -m etl.prepare_cimt_all
      - name: Create MySQL 8 schema and analytical views
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot < sql/01_schema.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot < sql/02_load.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot < sql/04_analytical_views.sql
      - name: Load original 36,197 HS6 import and total-export observations
        run: python etl/load_cimt_csv.py data/processed/cimt_all_trade_normalized_2020_2025.csv
      - name: Verify source counts, trade balances and HS220190 classification warning
        run: |
          python - <<'PY'
          import os
          import mysql.connector
          conn=mysql.connector.connect(
              host=os.environ["MYSQL_HOST"], user=os.environ["MYSQL_USER"],
              password=os.environ["MYSQL_PASSWORD"],database=os.environ["MYSQL_DATABASE"])
          c=conn.cursor()
          c.execute("SELECT trade_flow,COUNT(*) FROM fact_hs_trade GROUP BY trade_flow")
          actual=dict(c.fetchall())
          expected={"Import":24816,"Export":11381}
          assert actual==expected, (actual,expected)
          expected2025 = {
              "220110":(98740904,11315171),
              "220190":(49177038,15555617),
              "220210":(742467960,345659136),
              "220291":(36748545,10275799),
              "220299":(917338369,426863410),
          }
          for hs, (im,ex) in expected2025.items():
              c.execute("""SELECT trade_flow, SUM(value_cad)
                  FROM fact_hs_trade
                  WHERE hs_code=%s AND reference_period LIKE '2025-%%'
                  GROUP BY trade_flow""",(hs,))
              values=dict(c.fetchall())
              assert (int(values["Import"]),int(values["Export"]))==(im,ex), (hs,values)
              print("PASS:",hs,"imports",im,"exports",ex,"balance",ex-im)
          # Temporary CI review only; no automatic production approvals.
          c.execute("""UPDATE dim_hs_product SET review_status='approved'
                    WHERE hs_code IN ('220110','220190','220210','220291','220299')""")
          conn.commit()
          c.execute("""SELECT hs_code,SUM(imports_cad),SUM(exports_cad),SUM(trade_balance_cad)
            FROM vw_hs_trade_monthly_balance_canada
            WHERE reference_period LIKE '2025-%%'
            GROUP BY hs_code ORDER BY hs_code""")
          rows=c.fetchall()
          assert len(rows)==5,rows
          total=0
          for hs,imports,exports,balance in rows:
              expectedim,expectedex=expected2025[hs]
              assert (int(imports),int(exports),int(balance)) == (
                  expectedim,expectedex,expectedex-expectedim)
              total+=int(balance)
          assert total==-1034803683,total
          print("PASS: 36,197 records, all five 2025 trade balances, full 72 months per HS6")
          c.close();conn.close()
          PY
      - name: Upload normalized source rows, monthly and annual trade balances
        uses: actions/upload-artifact@v4
        with:
          name: cimt-five-hs6-import-export-2020-2025
          path: |
            data/processed/cimt_all_trade_normalized_2020_2025.csv
            data/processed/cimt_all_trade_monthly_balances_2020_2025.csv
            data/processed/cimt_all_trade_annual_balances_2020_2025.csv
            data/processed/cimt_all_trade_annual_partner_2020_2025.csv
            data/processed/cimt_all_profile.json
          retention-days: 7
