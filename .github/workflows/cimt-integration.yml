name: CIMT HS6 imports and total exports MySQL integration
on:
  push:
    branches: [main]
    paths:
      - 'data/source_exports/cimt/**'
      - 'etl/prepare_cimt_trade.py'
      - 'etl/prepare_cimt_exports.py'
      - 'etl/load_cimt_csv.py'
      - 'sql/**'
      - '.github/workflows/cimt-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: temporary_ci_test_password
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptemporary_ci_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      MYSQL_PWD: temporary_ci_test_password
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: temporary_ci_test_password
      MYSQL_DATABASE: canadian_beverage_market
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python and MySQL client
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y default-mysql-client
      - name: Normalize six original CIMT files and calculate monthly and annual balances
        run: python etl/prepare_cimt_trade.py
      - name: Create MySQL schema and views
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot < sql/01_schema.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot < sql/02_load.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot < sql/04_analytical_views.sql
      - name: Load 24,634 authentic import and total-export rows
        run: python etl/load_cimt_csv.py data/processed/cimt_trade_normalized_2020_2025.csv
      - name: Validate counts, flows, annual values and SQL trade-balance view
        run: |
          python - <<'PY'
          import os
          import mysql.connector
          conn = mysql.connector.connect(
              host=os.environ["MYSQL_HOST"], user=os.environ["MYSQL_USER"],
              password=os.environ["MYSQL_PASSWORD"], database=os.environ["MYSQL_DATABASE"]
          )
          c = conn.cursor()
          c.execute("SELECT trade_flow, COUNT(*) FROM fact_hs_trade GROUP BY trade_flow")
          counts = dict(c.fetchall())
          assert counts == {"Import": 15670, "Export": 8964}, counts
          expected = {
              "220210": (742467960, 345659136),
              "220291": (36748545, 10275799),
              "220299": (917338369, 426863410),
          }
          for hs, wanted in expected.items():
              c.execute("""SELECT trade_flow,SUM(value_cad) FROM fact_hs_trade
                WHERE hs_code=%s AND reference_period LIKE '2025-%%' GROUP BY trade_flow""",(hs,))
              values = dict(c.fetchall())
              actual = (int(values["Import"]),int(values["Export"]))
              assert actual == wanted, (hs,actual,wanted)
              print("PASS:",hs,actual,"balance",actual[1]-actual[0])
          # Approval here affects only temporary CI database; production requires manual review.
          c.execute("UPDATE dim_hs_product SET review_status='approved' WHERE hs_code IN ('220210','220291','220299')")
          conn.commit()
          c.execute("""SELECT hs_code,SUM(imports_cad),SUM(exports_cad),SUM(trade_balance_cad)
            FROM vw_hs_trade_monthly_balance_canada
            WHERE reference_period LIKE '2025-%%'
            GROUP BY hs_code ORDER BY hs_code""")
          for hs,imports,exports,balance in c.fetchall():
              assert (int(imports),int(exports)) == expected[hs]
              assert int(balance) == int(exports-imports)
          c.close();conn.close()
          print("PASS: 24,634 original rows, three 2025 HS balances and audited SQL view")
          PY
      - name: Upload normalized records, provenance and trade balances
        uses: actions/upload-artifact@v4
        with:
          name: cimt-2202-import-export-normalized-2020-2025
          path: |
            data/processed/cimt_trade_normalized_2020_2025.csv
            data/processed/cimt_trade_monthly_balances_2020_2025.csv
            data/processed/cimt_trade_annual_balances_2020_2025.csv
            data/processed/cimt_trade_annual_partner_2020_2025.csv
            data/processed/cimt_trade_profile.json
          retention-days: 7
